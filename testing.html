<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Hunt</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07080b;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-strong: rgba(255, 255, 255, 0.08);
        --text: #f4f6fb;
        --muted: rgba(244, 246, 251, 0.64);
        --line: rgba(255, 255, 255, 0.1);
        --accent: #ff4d5e;
        --accent-soft: rgba(255, 77, 94, 0.2);
        --good: #43f1a6;
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(255, 77, 94, 0.12), transparent 32%),
          radial-gradient(circle at bottom right, rgba(67, 241, 166, 0.08), transparent 28%),
          linear-gradient(180deg, #050608, #090a0f 60%, #050608);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(760px, 100%);
        min-height: min(720px, calc(100vh - 48px));
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 18px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
        position: relative;
      }

      .app::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 85%);
        pointer-events: none;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        z-index: 1;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand h1 {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        font-variant-numeric: tabular-nums;
      }

      .status span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .status strong {
        color: var(--text);
        font-size: 1.02rem;
      }

      .timer-wrap {
        display: grid;
        gap: 10px;
        align-content: start;
        z-index: 1;
      }

      .timer-label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        color: var(--muted);
        font-size: 0.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .timer-track {
        position: relative;
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      .timer-fill {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--good), #e4ff79 40%, #ffb14d 70%, var(--accent));
        transform-origin: left center;
        transform: scaleX(1);
        transition: transform 60ms linear, filter 160ms ease;
        box-shadow: 0 0 30px rgba(255, 77, 94, 0.35);
      }

      .timer-track.is-hot .timer-fill {
        filter: saturate(1.2) brightness(1.05);
      }

      .center {
        display: grid;
        place-items: center;
        z-index: 1;
      }

      .problem-shell {
        width: min(100%, 560px);
        display: grid;
        gap: 18px;
        justify-items: center;
        text-align: center;
      }

      .problem {
        margin: 0;
        font-size: clamp(3.25rem, 10vw, 7rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
        font-weight: 800;
        text-shadow: 0 0 28px rgba(255, 255, 255, 0.05);
        user-select: none;
      }

      .subtext {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        max-width: 34rem;
      }

      .input-wrap {
        display: grid;
        gap: 10px;
        z-index: 1;
      }

      .input-label {
        color: var(--muted);
        font-size: 0.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .answer {
        width: 100%;
        padding: 18px 20px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.36);
        color: var(--text);
        font: inherit;
        font-size: clamp(1.25rem, 4vw, 1.7rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-align: center;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .answer:focus {
        border-color: rgba(255, 77, 94, 0.65);
        box-shadow:
          0 0 0 4px rgba(255, 77, 94, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .answer::placeholder {
        color: rgba(244, 246, 251, 0.26);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        z-index: 1;
        color: var(--muted);
        font-size: 0.92rem;
        flex-wrap: wrap;
      }

      .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        padding: 10px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.08);
      }

      button.primary {
        background: linear-gradient(180deg, rgba(255, 77, 94, 0.92), rgba(214, 45, 63, 0.92));
        border-color: rgba(255, 77, 94, 0.7);
        box-shadow: 0 16px 28px rgba(255, 77, 94, 0.18);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, rgba(7, 8, 11, 0.1), rgba(7, 8, 11, 0.78));
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .card {
        width: min(92%, 380px);
        padding: 26px;
        border-radius: 24px;
        border: 1px solid var(--line);
        background: rgba(8, 10, 14, 0.88);
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 2rem;
        letter-spacing: -0.05em;
      }

      .card p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .flash {
        animation: flash 160ms ease-out;
      }

      .shake {
        animation: shake 220ms ease-in-out;
      }

      .danger {
        color: var(--accent);
      }

      @keyframes flash {
        0% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.25);
        }
        100% {
          filter: brightness(1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-4px);
        }
        40% {
          transform: translateX(4px);
        }
        60% {
          transform: translateX(-3px);
        }
        80% {
          transform: translateX(3px);
        }
      }

      @media (max-width: 640px) {
        .app {
          min-height: calc(100vh - 24px);
          padding: 18px;
          border-radius: 22px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .status {
          width: 100%;
          justify-content: space-between;
        }

        .problem {
          font-size: clamp(3rem, 18vw, 5.5rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="app" id="app">
      <div class="topbar">
        <div class="brand">
          <h1>Math Hunt</h1>
          <p>Type fast. Stay alive.</p>
        </div>
        <div class="status" aria-live="polite">
          <span>Streak <strong id="streak">0</strong></span>
          <span>Best <strong id="best">0</strong></span>
        </div>
      </div>

      <section class="timer-wrap" aria-label="Timer">
        <div class="timer-label">
          <span>Time pressure</span>
          <span><strong id="timeLeft">10.0</strong>s</span>
        </div>
        <div class="timer-track" id="timerTrack">
          <div class="timer-fill" id="timerFill"></div>
        </div>
      </section>

      <section class="center">
        <div class="problem-shell" id="problemShell">
          <p class="problem" id="problem">Press Start</p>
          <p class="subtext" id="hint">Two-digit math. Answer with numbers only, then press Enter.</p>
        </div>
      </section>

      <section class="input-wrap">
        <div class="input-label">Answer</div>
        <input
          id="answer"
          class="answer"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Type your answer"
          disabled
        />
      </section>

      <footer class="footer">
        <div id="statusText">Ready when you are.</div>
        <div class="buttons">
          <button id="restartBtn" class="primary">Start</button>
        </div>
      </footer>

      <div class="overlay show" id="overlay" aria-hidden="false">
        <div class="card">
          <h2>Math Hunt</h2>
          <p>
            A tiny race against the clock. Two-digit problems, a shrinking timer, and one
            chance to keep the streak alive.
          </p>
          <button id="overlayStart" class="primary">Start Run</button>
        </div>
      </div>
    </main>

    <script>
      const els = {
        app: document.getElementById("app"),
        problem: document.getElementById("problem"),
        hint: document.getElementById("hint"),
        answer: document.getElementById("answer"),
        timerFill: document.getElementById("timerFill"),
        timerTrack: document.getElementById("timerTrack"),
        timeLeft: document.getElementById("timeLeft"),
        streak: document.getElementById("streak"),
        best: document.getElementById("best"),
        statusText: document.getElementById("statusText"),
        overlay: document.getElementById("overlay"),
        overlayStart: document.getElementById("overlayStart"),
        restartBtn: document.getElementById("restartBtn"),
        problemShell: document.getElementById("problemShell"),
      };

      const state = {
        running: false,
        streak: 0,
        best: 0,
        currentAnswer: 0,
        currentProblem: "",
        timeLeft: 0,
        duration: 10,
        lastTick: 0,
        raf: 0,
      };

      function readBestScore() {
        try {
          return Number(localStorage.getItem("mathHuntBest") || 0);
        } catch {
          return 0;
        }
      }

      function writeBestScore(value) {
        try {
          localStorage.setItem("mathHuntBest", String(value));
        } catch {
          // Best score persistence is optional.
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatTime(seconds) {
        return seconds.toFixed(1);
      }

      function calcDuration(streak) {
        const start = 10;
        const floor = 3.2;
        const drop = 0.22;
        return clamp(start - streak * drop, floor, start);
      }

      function randomTwoDigit() {
        return 10 + Math.floor(Math.random() * 90);
      }

      function makeProblem() {
        const a = randomTwoDigit();
        const b = randomTwoDigit();
        const plus = Math.random() < 0.75;

        if (plus) {
          return {
            text: `${a} + ${b}`,
            answer: a + b,
          };
        }

        const high = Math.max(a, b);
        const low = Math.min(a, b);
        return {
          text: `${high} - ${low}`,
          answer: high - low,
        };
      }

      function updateHUD() {
        els.streak.textContent = state.streak;
        els.best.textContent = state.best;
        els.timeLeft.textContent = formatTime(Math.max(0, state.timeLeft));
        const progress = clamp(state.timeLeft / state.duration, 0, 1);
        els.timerFill.style.transform = `scaleX(${progress})`;
        els.timerTrack.classList.toggle("is-hot", progress < 0.35);
      }

      function setStatus(message, tone = "") {
        els.statusText.className = tone ? tone : "";
        els.statusText.textContent = message;
      }

      function retriggerClass(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
      }

      function showOverlay(show) {
        els.overlay.classList.toggle("show", show);
        els.overlay.setAttribute("aria-hidden", String(!show));
      }

      function newProblem() {
        const problem = makeProblem();
        state.currentProblem = problem.text;
        state.currentAnswer = problem.answer;
        state.duration = calcDuration(state.streak);
        state.timeLeft = state.duration;
        state.lastTick = performance.now();
        els.problem.textContent = problem.text;
        els.answer.value = "";
        els.answer.disabled = false;
        els.answer.focus();
        updateHUD();
      }

      function endRun(reason = "Time's up.") {
        state.running = false;
        cancelAnimationFrame(state.raf);
        els.answer.disabled = true;
        showOverlay(true);
        els.overlayStart.textContent = "Try Again";
        els.problem.textContent = "Run Over";
        els.hint.textContent = `Best streak: ${state.best}.`;
        setStatus(reason, "danger");
        retriggerClass(els.app, "shake");
      }

      function nextRound() {
        state.running = true;
        showOverlay(false);
        els.overlayStart.textContent = "Start Run";
        els.problemShell.classList.remove("flash");
        newProblem();
        setStatus(`Timer starts at ${formatTime(state.duration)}s.`, "");
        tick(performance.now());
      }

      function tick(now) {
        if (!state.running) return;
        const delta = (now - state.lastTick) / 1000;
        state.lastTick = now;
        state.timeLeft -= delta;
        updateHUD();

        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          updateHUD();
          endRun("Too slow.");
          return;
        }

        if (state.timeLeft < 1.25) {
          els.problemShell.classList.add("flash");
        } else {
          els.problemShell.classList.remove("flash");
        }

        state.raf = requestAnimationFrame(tick);
      }

      function submitAnswer() {
        if (!state.running) return;

        const raw = els.answer.value.trim();
        if (!/^\d+$/.test(raw)) return;

        const value = Number(raw);
        if (value === state.currentAnswer) {
          state.streak += 1;
          state.best = Math.max(state.best, state.streak);
          writeBestScore(state.best);
          setStatus("Clean hit.", "danger");
          retriggerClass(els.problemShell, "flash");
          updateHUD();
          newProblem();
        } else {
          endRun(`Missed: ${state.currentProblem} = ${state.currentAnswer}.`);
        }
      }

      function startGame() {
        state.streak = 0;
        els.hint.textContent = "Two-digit math. Answer with numbers only, then press Enter.";
        setStatus("Go.", "");
        nextRound();
      }

      els.answer.addEventListener("input", () => {
        els.answer.value = els.answer.value.replace(/\D+/g, "");
      });

      els.answer.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submitAnswer();
        }
      });

      els.restartBtn.addEventListener("click", startGame);
      els.overlayStart.addEventListener("click", startGame);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !state.running) {
          startGame();
        }
      });

      state.best = readBestScore();
      els.best.textContent = state.best;
      updateHUD();
    </script>
  </body>
</html>
